<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Noto Sans KR"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', 'Noto Sans KR', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#100d1b] dark:text-white min-h-screen">
<div class="relative flex h-full min-h-screen w-full max-w-[430px] mx-auto flex-col overflow-x-hidden shadow-2xl bg-white dark:bg-background-dark">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="text-[#100d1b] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#100d1b] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">비밀번호 변경</h2>
</div>
<div class="flex-1 overflow-y-auto">
<!-- HeadlineText -->
<div class="px-4 pb-4 pt-6">
<h3 class="text-[#100d1b] dark:text-white tracking-light text-2xl font-bold leading-tight">새로운 비밀번호를<br/>설정해주세요</h3>
<p class="text-[#594c9a] dark:text-gray-400 text-sm mt-2">안전한 계정 관리를 위해 주기적인 비밀번호 변경을 권장합니다.</p>
</div>
<div class="space-y-2">
<!-- TextField: Current Password -->
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#100d1b] dark:text-white text-base font-medium leading-normal pb-2">현재 비밀번호</p>
<div class="flex w-full flex-1 items-stretch rounded-xl group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#594c9a]/50 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-all" placeholder="현재 비밀번호 입력" type="password" value=""/>
<div class="text-[#594c9a] dark:text-gray-400 flex border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- TextField: New Password -->
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#100d1b] dark:text-white text-base font-medium leading-normal pb-2">새 비밀번호</p>
<div class="flex w-full flex-1 items-stretch rounded-xl group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#594c9a]/50 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-all" placeholder="새 비밀번호 입력" type="password" value=""/>
<div class="text-[#594c9a] dark:text-gray-400 flex border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- TextField: Confirm New Password -->
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#100d1b] dark:text-white text-base font-medium leading-normal pb-2">새 비밀번호 확인</p>
<div class="flex w-full flex-1 items-stretch rounded-xl group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#594c9a]/50 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal transition-all" placeholder="새 비밀번호 다시 입력" type="password" value=""/>
<div class="text-[#594c9a] dark:text-gray-400 flex border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-[15px] rounded-r-xl border-l-0">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
</div>
<!-- Security Rules Info Box -->
<div class="mx-4 mt-6 p-4 rounded-xl bg-primary/5 dark:bg-primary/10 border border-primary/10">
<h4 class="text-[#100d1b] dark:text-white text-sm font-bold mb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">info</span>
                    비밀번호 보안 규칙
                </h4>
<ul class="text-xs text-[#594c9a] dark:text-gray-400 space-y-1.5 list-disc pl-4">
<li>영문 대소문자, 숫자, 특수문자 중 3종류 이상 조합</li>
<li>8자 이상 16자 이하로 설정</li>
<li>아이디와 3자 이상 동일한 문자 포함 불가</li>
<li>연속된 숫자나 문자(예: 123, abc) 3자 이상 사용 불가</li>
</ul>
</div>
</div>
<!-- Action Button -->
<div class="p-4 bg-white dark:bg-background-dark border-t border-gray-100 dark:border-gray-800 pb-10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                비밀번호 변경 완료
            </button>
</div>
</div>
</body></html>
