<!DOCTYPE html>
<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "indigo-blue": "#2E3192",
                        "background-light": "#F8F9FD",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>메인 대시보드 (고도화)</title>
<style type="text/tailwindcss">
        body {
            min-height: 100dvh;
        }
        .nav-blur {
            @apply backdrop-blur-md bg-white/70;
        }
        .plus-button {
            box-shadow: 0 4px 14px 0 rgba(55, 19, 236, 0.39);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-display text-[#100d1b] min-h-screen">
<header class="sticky top-0 z-50 nav-blur border-b border-gray-100">
<div class="flex items-center justify-between px-5 h-16">
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">menu</span>
</button>
<div class="relative">
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">notifications</span>
<span class="absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white"></span>
</button>
</div>
</div>
</header>
<main class="px-5 pb-32">
<section class="pt-8 pb-6">
<h1 class="text-2xl font-medium text-gray-800 leading-tight">
<span class="text-indigo-blue font-bold text-3xl">홍길동</span>님, 안녕하세요 👋
            </h1>
<p class="text-gray-500 mt-2 text-sm">따뜻한 나눔으로 세상을 더 밝게 만들어주세요.</p>
</section>
<section class="mb-8">
<div class="bg-indigo-blue rounded-2xl p-6 flex justify-between items-center shadow-lg shadow-indigo-100">
<div class="flex flex-col gap-1">
<h2 class="text-white text-xl font-bold">기부 신청하기</h2>
<p class="text-indigo-100 text-xs font-light">지금 바로 따뜻함을 나누세요</p>
</div>
<div class="bg-white/20 p-3 rounded-full">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1">volunteer_activism</span>
</div>
</div>
</section>
<section class="mb-8">
<div class="grid grid-cols-2 gap-4">
<div class="bg-white p-5 rounded-2xl border border-blue-50 flex flex-col gap-4 shadow-sm">
<div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">calculate</span>
</div>
<div>
<p class="font-bold text-gray-900 text-[15px]">기부 한도 조회</p>
<p class="text-[11px] text-gray-400 mt-0.5">최대 금액 계산</p>
</div>
</div>
<div class="bg-white p-5 rounded-2xl border border-purple-50 flex flex-col gap-4 shadow-sm">
<div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<div>
<p class="font-bold text-gray-900 text-[15px]">기부 내역 확인</p>
<p class="text-[11px] text-gray-400 mt-0.5">내 활동 보기</p>
</div>
</div>
<div class="bg-white p-5 rounded-2xl border border-orange-50 flex flex-col gap-4 shadow-sm">
<div class="w-10 h-10 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">person_edit</span>
</div>
<div>
<p class="font-bold text-gray-900 text-[15px]">회원 정보 수정</p>
<p class="text-[11px] text-gray-400 mt-0.5">개인정보 관리</p>
</div>
</div>
<div class="bg-white p-5 rounded-2xl border border-teal-50 flex flex-col gap-4 shadow-sm">
<div class="w-10 h-10 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">lock_reset</span>
</div>
<div>
<p class="font-bold text-gray-900 text-[15px]">비밀번호 변경</p>
<p class="text-[11px] text-gray-400 mt-0.5">보안 설정 강화</p>
</div>
</div>
</div>
</section>
<section class="mb-6">
<div class="relative overflow-hidden rounded-2xl h-32 bg-gradient-to-br from-indigo-500 to-purple-600 shadow-md">
<div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
<div class="absolute -left-4 -top-4 w-16 h-16 bg-white/10 rounded-full blur-xl"></div>
<div class="relative h-full w-full p-6 flex flex-col justify-center">
<span class="text-[10px] bg-white/20 text-white w-fit px-2 py-0.5 rounded-full mb-2 font-medium">GUIDE</span>
<h3 class="text-white text-lg font-bold leading-tight">2024년 세금 환급 가이드</h3>
<p class="text-white/80 text-xs mt-1">기부금 공제 혜택 놓치지 마세요</p>
</div>
<div class="absolute right-6 top-1/2 -translate-y-1/2 opacity-20">
<span class="material-symbols-outlined text-6xl text-white">request_quote</span>
</div>
</div>
</section>
</main>
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex items-center justify-between px-4 pt-2 pb-6 z-[60]">
<button class="flex flex-col items-center gap-1 w-16 text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1">home</span>
<span class="text-[10px] font-bold">홈</span>
</button>
<button class="flex flex-col items-center gap-1 w-16 text-gray-400">
<span class="material-symbols-outlined text-2xl">history</span>
<span class="text-[10px] font-medium">내역</span>
</button>
<div class="relative -top-6">
<button class="plus-button flex items-center justify-center w-14 h-14 bg-primary text-white rounded-full border-4 border-white">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<button class="flex flex-col items-center gap-1 w-16 text-gray-400">
<span class="material-symbols-outlined text-2xl">payments</span>
<span class="text-[10px] font-medium">환급액</span>
</button>
<button class="flex flex-col items-center gap-1 w-16 text-gray-400">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-[10px] font-medium">MY</span>
</button>
</nav>

</body></html>
