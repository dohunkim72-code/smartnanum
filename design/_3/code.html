<!DOCTYPE html>
<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Noto Sans KR"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', 'Noto Sans KR', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#100d1b] dark:text-white min-h-screen flex flex-col">
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 justify-between max-w-[480px] mx-auto">
<div class="flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-[#100d1b] dark:text-white">arrow_back_ios</span>
</div>
<h2 class="text-lg font-bold leading-tight flex-1 text-center pr-10">회원가입</h2>
</div>
</header>
<main class="flex-1 max-w-[480px] mx-auto w-full pb-8">
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-center">
<p class="text-base font-medium leading-normal">상세 정보 입력</p>
<span class="text-xs font-semibold text-primary">2 / 2</span>
</div>
<div class="rounded-full bg-[#d3cfe7] dark:bg-gray-700 h-2 overflow-hidden">
<div class="h-full bg-primary" style="width: 100%;"></div>
</div>
</div>
<div class="space-y-2">
<div class="px-4 py-2">
<label class="flex flex-col">
<p class="text-sm font-semibold pb-2 px-1">아이디</p>
<div class="flex gap-2">
<div class="flex flex-1 items-stretch rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 overflow-hidden focus-within:border-primary">
<input class="w-full border-none bg-transparent h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:ring-0" placeholder="6~20자 영문, 숫자" value=""/>
<div class="flex items-center px-4">
<span class="material-symbols-outlined text-green-500 text-xl">check_circle</span>
</div>
</div>
<button class="bg-primary/10 text-primary px-4 rounded-xl font-bold text-sm shrink-0 whitespace-nowrap">중복확인</button>
</div>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col">
<p class="text-sm font-semibold pb-2 px-1">비밀번호</p>
<div class="flex flex-col gap-2">
<input class="w-full rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:border-primary focus:ring-0" placeholder="영문, 숫자, 특수문자 조합 8자 이상" type="password"/>
<p class="text-[11px] text-[#594c9a] dark:text-gray-400 px-1">보안 규칙: 8~16자 이내, 영문/숫자/특수문자 조합</p>
</div>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col">
<p class="text-sm font-semibold pb-2 px-1">이름</p>
<input class="w-full rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:border-primary focus:ring-0" placeholder="실명 입력"/>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col">
<p class="text-sm font-semibold pb-2 px-1">이메일 주소</p>
<input class="w-full rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:border-primary focus:ring-0" placeholder="example@email.com" type="email"/>
</label>
</div>
<div class="px-4 py-2">
<label class="flex flex-col">
<p class="text-sm font-semibold pb-2 px-1">휴대폰 번호</p>
<div class="flex gap-2 mb-2">
<input class="flex-1 rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:border-primary focus:ring-0" placeholder="'-' 제외 숫자만 입력" type="tel"/>
<button class="bg-primary/10 text-primary px-4 rounded-xl font-bold text-sm shrink-0 whitespace-nowrap">인증번호 전송</button>
</div>
<div class="relative">
<input class="w-full rounded-xl border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-14 placeholder:text-[#594c9a] p-4 text-base outline-none focus:border-primary focus:ring-0" placeholder="인증번호 6자리"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-red-500 font-medium text-sm">03:00</span>
</div>
</label>
</div>
<div class="h-4"></div>
<div class="mx-4 p-4 rounded-xl bg-primary/5 dark:bg-white/5 border border-primary/10">
<p class="text-sm font-bold mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">redeem</span>
                    추천인 정보 (선택)
                </p>
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col">
<p class="text-xs text-[#594c9a] mb-1 px-1">추천인 코드</p>
<input class="w-full rounded-lg border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-12 placeholder:text-[#594c9a]/50 p-3 text-sm outline-none focus:border-primary focus:ring-0" placeholder="4자리 코드"/>
</div>
<div class="flex flex-col">
<p class="text-xs text-[#594c9a] mb-1 px-1">소개자 성명</p>
<input class="w-full rounded-lg border border-[#d3cfe7] dark:border-gray-600 bg-white dark:bg-gray-800 h-12 placeholder:text-[#594c9a]/50 p-3 text-sm outline-none focus:border-primary focus:ring-0" placeholder="소개자 이름"/>
</div>
</div>
</div>
<div class="px-4 py-6">
<div class="flex flex-col gap-4">
<label class="flex items-center gap-3 p-4 rounded-xl bg-white dark:bg-gray-800 border border-[#d3cfe7] dark:border-gray-600">
<input class="w-6 h-6 rounded-full text-primary focus:ring-0 border-[#d3cfe7]" type="checkbox"/>
<span class="text-base font-bold">전체 약관 동의하기</span>
</label>
<div class="px-2 space-y-3">
<div class="flex items-center justify-between text-sm text-[#594c9a] dark:text-gray-400">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">check</span>
<span>개인정보 수집 및 이용 동의 (필수)</span>
</div>
<span class="material-symbols-outlined text-lg cursor-pointer">chevron_right</span>
</div>
</div>
</div>
</div>
<div class="px-4 pb-8">
<button class="w-full bg-primary text-white font-bold h-14 rounded-xl text-lg shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all">
                    가입하기
                </button>
</div>
</div>
</main>

</body></html>
