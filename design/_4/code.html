<!DOCTYPE html>
<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Noto Sans KR"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', 'Noto Sans KR', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden max-w-[480px] mx-auto">
<div class="flex items-center bg-transparent p-4 justify-between">
<button class="flex items-center justify-center p-2 text-primary">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<div class="h-5"></div>
</div>
<div class="flex flex-col items-center justify-center pt-12 pb-8">
<div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<h2 class="text-[#100d1b] dark:text-white tracking-light text-[28px] font-bold leading-tight px-4 text-center">기부금 환급의 시작</h2>
<p class="text-[#594c9a] dark:text-gray-400 text-sm mt-2 opacity-0">Hidden context spacer</p> 
</div>
<div class="px-6 py-6 flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-[#100d1b] dark:text-gray-200 text-base font-medium leading-normal">아이디</label>
<input class="form-input flex w-full rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-[#d3cfe7] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#594c9a]/60 p-[15px] text-base font-normal" placeholder="아이디를 입력하세요" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#100d1b] dark:text-gray-200 text-base font-medium leading-normal">비밀번호</label>
<div class="flex w-full items-stretch rounded-xl overflow-hidden border border-[#d3cfe7] dark:border-gray-700 focus-within:ring-2 focus-within:ring-primary">
<input class="form-input flex w-full border-none bg-white dark:bg-gray-800 text-[#100d1b] dark:text-white focus:outline-0 focus:ring-0 h-14 placeholder:text-[#594c9a]/60 p-[15px] pr-2 text-base font-normal" placeholder="비밀번호를 입력하세요" type="password"/>
<div class="text-[#594c9a] flex bg-white dark:bg-gray-800 items-center justify-center pr-[15px]">
<span class="material-symbols-outlined cursor-pointer">visibility</span>
</div>
</div>
</div>
</div>
<div class="px-6 py-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center text-lg">
                로그인
            </button>
</div>
<div class="flex justify-center items-center gap-4 py-6 text-sm text-[#594c9a] dark:text-gray-400">
<a class="hover:underline" href="#">아이디 찾기</a>
<span class="text-gray-300">|</span>
<a class="hover:underline" href="#">비밀번호 재설정</a>
</div>
<div class="flex-grow"></div>
<div class="px-6 pb-20">
<button class="w-full bg-white dark:bg-transparent border-2 border-primary text-primary font-bold py-4 rounded-xl hover:bg-primary/5 transition-all text-lg">
                회원가입
            </button>
</div>
</div>

</body></html>
