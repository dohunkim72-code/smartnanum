<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>회원정보 수정</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3713ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Noto Sans KR"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', 'Noto Sans KR', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#100d1b] dark:text-white min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-[480px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-[#100d1b] dark:text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#100d1b] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">회원정보 수정</h2>
</div>
<div class="flex flex-col gap-6 p-4">
<!-- Read-only Section -->
<div class="bg-white dark:bg-white/5 rounded-xl overflow-hidden shadow-sm">
<!-- ListItem: ID -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between border-b border-gray-100 dark:border-white/10">
<p class="text-gray-500 dark:text-gray-400 text-sm font-medium">아이디</p>
<div class="flex items-center gap-2">
<p class="text-[#100d1b] dark:text-white text-base font-normal">donation_user01</p>
<span class="material-symbols-outlined text-gray-400 text-[20px]">lock</span>
</div>
</div>
<!-- ListItem: Name -->
<div class="flex items-center gap-4 px-4 min-h-14 justify-between">
<p class="text-gray-500 dark:text-gray-400 text-sm font-medium">이름</p>
<div class="flex items-center gap-2">
<p class="text-[#100d1b] dark:text-white text-base font-normal">홍길동</p>
<span class="material-symbols-outlined text-gray-400 text-[20px]">lock</span>
</div>
</div>
</div>
<!-- Editable Section -->
<div class="flex flex-col gap-4">
<h3 class="text-[#100d1b] dark:text-white text-sm font-bold px-1">연락처 정보</h3>
<!-- TextField: Email -->
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#100d1b] dark:text-white text-sm font-medium leading-normal pb-2">이메일</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-0 border border-gray-200 dark:border-white/20 bg-white dark:bg-white/5 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" placeholder="이메일을 입력하세요" type="email" value="hong@example.com"/>
</label>
</div>
<!-- TextField: Phone with Verification -->
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#100d1b] dark:text-white text-sm font-medium leading-normal pb-2">휴대폰 번호</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#100d1b] dark:text-white focus:outline-0 focus:ring-0 border border-gray-200 dark:border-white/20 bg-white dark:bg-white/5 focus:border-primary h-14 placeholder:text-gray-400 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" type="tel" value="010-1234-5678"/>
<button class="flex border border-gray-200 dark:border-white/20 bg-white dark:bg-white/10 items-center justify-center px-4 rounded-r-xl border-l-0 text-primary font-bold text-sm">
                                인증요청
                            </button>
</div>
</label>
</div>
<!-- Verification Code Section (visible after request) -->
<div class="flex flex-col gap-3 p-4 bg-primary/5 dark:bg-primary/10 rounded-xl border border-primary/20">
<div class="flex justify-between items-center">
<p class="text-primary text-sm font-bold">인증번호 입력</p>
<span class="text-primary text-xs font-medium">03:00</span>
</div>
<div class="grid grid-cols-6 gap-2">
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-full aspect-square text-center rounded-lg border border-primary/30 bg-white dark:bg-background-dark text-lg font-bold focus:ring-1 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<p class="text-[11px] text-gray-500 dark:text-gray-400">인증번호가 도착하지 않았나요? <span class="underline">다시 보내기</span></p>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="mt-auto p-4 mb-8">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">
                저장하기
            </button>
<button class="w-full mt-4 text-gray-400 dark:text-gray-500 text-sm font-medium py-2">
                회원 탈퇴
            </button>
</div>
</div>
</body></html>
